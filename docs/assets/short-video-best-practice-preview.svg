<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07120d"/>
      <stop offset="0.58" stop-color="#0d1a14"/>
      <stop offset="1" stop-color="#10100c"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d2e"/>
      <stop offset="1" stop-color="#f3c64a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <rect x="66" y="78" width="948" height="120" rx="0" fill="#0f251a"/>
  <text x="96" y="130" fill="#e8fff3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Sentinel AI</text>
  <text x="96" y="172" fill="#95b7a3" font-family="Inter, Arial, sans-serif" font-size="24">Context, not financial advice.</text>
  <text x="858" y="146" fill="#95b7a3" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="end">0-2s hook</text>

  <g filter="url(#softShadow)">
    <rect x="66" y="246" width="948" height="410" rx="8" fill="#122119"/>
    <text x="104" y="340" fill="#e8fff3" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">$NVDA</text>
    <rect x="104" y="378" width="268" height="70" rx="4" fill="url(#heat)"/>
    <text x="238" y="425" fill="#11140f" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800" text-anchor="middle">HEATED</text>
    <text x="104" y="520" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="760">Three signals are firing</text>
    <text x="104" y="582" fill="#bad6c5" font-family="Inter, Arial, sans-serif" font-size="34">before the next earnings window.</text>
  </g>

  <g>
    <rect x="66" y="724" width="948" height="236" rx="8" fill="#18251f"/>
    <rect x="96" y="760" width="10" height="164" fill="#f3c64a"/>
    <text x="134" y="808" fill="#e8fff3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="760">1. Expectation crowding</text>
    <text x="134" y="858" fill="#a9c2b2" font-family="Inter, Arial, sans-serif" font-size="28">Everyone is watching the same catalyst.</text>
    <text x="134" y="914" fill="#f7e2a2" font-family="Inter, Arial, sans-serif" font-size="24">Risk flag: volatility can amplify when results land.</text>
  </g>

  <g>
    <rect x="66" y="1002" width="948" height="236" rx="8" fill="#16231d"/>
    <rect x="96" y="1038" width="10" height="164" fill="#ff7b49"/>
    <text x="134" y="1086" fill="#e8fff3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="760">2. Margin sensitivity</text>
    <text x="134" y="1136" fill="#a9c2b2" font-family="Inter, Arial, sans-serif" font-size="28">Guidance matters more when expectations are high.</text>
    <text x="134" y="1192" fill="#f7c1a8" font-family="Inter, Arial, sans-serif" font-size="24">Risk flag: a small miss can change the whole read.</text>
  </g>

  <g>
    <rect x="66" y="1280" width="948" height="236" rx="8" fill="#14211b"/>
    <rect x="96" y="1316" width="10" height="164" fill="#dd5b5b"/>
    <text x="134" y="1364" fill="#e8fff3" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="760">3. Valuation compression</text>
    <text x="134" y="1414" fill="#a9c2b2" font-family="Inter, Arial, sans-serif" font-size="28">Crowded attention raises downside sensitivity.</text>
    <text x="134" y="1470" fill="#f1b0b0" font-family="Inter, Arial, sans-serif" font-size="24">Risk flag: sentiment can cool faster than fundamentals.</text>
  </g>

  <rect x="66" y="1592" width="948" height="170" rx="8" fill="#d7ffe2"/>
  <text x="104" y="1654" fill="#0b1711" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="820">Preview the full $NVDA context</text>
  <text x="104" y="1708" fill="#17492f" font-family="Inter, Arial, sans-serif" font-size="30">app.jilo.ai/stocks/NVDA</text>

  <text x="540" y="1842" fill="#6f8b78" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle">Designed for YouTube Shorts / TikTok safe center area</text>
</svg>

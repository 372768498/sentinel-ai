[project]
name = "xiangyu-finance-stock-analyzing"
version = "7.0.0"
description = "美股与加密货币分析工具 - 含回测引擎与 AI 预测"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fear-and-greed>=0.4",
    "edgartools>=2.0.0",
    "feedparser>=6.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
]
backtest-pro = [
    "vectorbt>=0.26.0",
    "numba>=0.58.0",
]
full = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "vectorbt>=0.26.0",
    "numba>=0.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

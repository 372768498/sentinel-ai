services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: sentinel-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKER_PUBLIC_URL: http://localhost:8001
      NEXT_PUBLIC_WORKER_URL: http://localhost:8001
      WORKER_INTERNAL_TOKEN: local-dev-worker-token
      RESEND_FROM_EMAIL: Sentinel AI <mock@local.dev>
      INTERNAL_CALLBACK_SECRET: local-dev-callback-secret
      PYTHON_SKILL_DIR: ./skills/xiangyu-finance-stock-analyzing/scripts/python
      PYTHON_EXECUTABLE: python
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sentinel_ai?schema=public
      SEC_USER_AGENT: Sentinel AI local-dev@example.com
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    command: uvicorn worker.app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
